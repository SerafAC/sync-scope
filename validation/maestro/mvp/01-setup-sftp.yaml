# Story 1 sc. 2 and 4, FR-004, SC-002 (SFTP): set up SFTP through the form.
# The first test shows the server key fingerprint; Trust server key approves
# it and the test connects. No unencrypted warning for SFTP.
# Self-contained: starts from clearState (contracts/maestro-mvp.md).
appId: com.syncscope
name: mvp/01-setup-sftp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- runFlow:
    file: ../subflows/setup-repository.yaml
    env:
      PROTOCOL: "SFTP"
      HOST: "${SFTP_HOST}"
      PORT: "${SFTP_PORT}"
      USER: "${SFTP_USER}"
      PASSWORD: "${SFTP_PASSWORD}"
      ROOT: "${(SFTP_ROOT.endsWith('/') ? SFTP_ROOT.slice(0, -1) : SFTP_ROOT) + '/gallery'}"
      EXPECT: "Server key fingerprint .+"
- assertVisible: "Trust server key"
- assertVisible: "Reject server key"
- assertNotVisible: "Server key changed warning"
- tapOn: "Trust server key"
- extendedWaitUntil:
    visible: "Connected, [0-9]+ entries"
    timeout: 60000
- assertNotVisible: "Unencrypted connection warning"
- back
- extendedWaitUntil:
    visible: "Repository SFTP ${SFTP_HOST}"
    timeout: 15000
