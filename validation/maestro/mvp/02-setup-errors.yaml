# Story 1 sc. 3, FR-003: a wrong password fails with the AUTH_FAILED message;
# the host and user stay filled and the password field is empty. Typing the
# right password connects. Editing the host and going back asks to discard
# the change, and discarding keeps the saved repository.
# Self-contained: starts from clearState (contracts/maestro-mvp.md).
appId: com.syncscope
name: mvp/02-setup-errors
---
- evalScript: "${output.ftpRoot = (FTP_ROOT.endsWith('/') ? FTP_ROOT.slice(0, -1) : FTP_ROOT) + '/gallery'}"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000

# Wrong password.
- runFlow:
    file: ../subflows/setup-repository.yaml
    env:
      PROTOCOL: "FTP"
      HOST: "${FTP_HOST}"
      PORT: "${FTP_PORT}"
      USER: "${FTP_USER}"
      PASSWORD: "${FTP_PASSWORD + 'wrong'}"
      ROOT: "${output.ftpRoot}"
      EXPECT: "Connection failed: .+"
- assertVisible: "Connection failed: The FTP server rejected the username or password."
- assertVisible: "Check the credentials and try again."
- assertNotVisible: "Connected, [0-9]+ entries"
- scrollUntilVisible:
    element: "Host"
    direction: UP
- assertVisible:
    text: "${FTP_HOST}"
- assertVisible:
    text: "${FTP_USER}"
# A typed secure password is dumped as bullets; none means the field is empty.
- assertNotVisible: "•+"

# Fix the password.
- runFlow:
    file: ../subflows/setup-repository.yaml
    env:
      PROTOCOL: "FTP"
      HOST: "${FTP_HOST}"
      PORT: "${FTP_PORT}"
      USER: "${FTP_USER}"
      PASSWORD: "${FTP_PASSWORD}"
      ROOT: "${output.ftpRoot}"
      START: "form"
- assertVisible: "Connected, [0-9]+ entries"
- assertNotVisible: "Connection failed: .+"

# An unsaved edit asks before leaving.
- scrollUntilVisible:
    element: "Host"
    direction: UP
- tapOn: "Host"
- eraseText: 64
- inputText: "10.0.2.3"
- hideKeyboard
- back
- extendedWaitUntil:
    visible: "Discard changes"
    timeout: 15000
- assertVisible: "Keep editing"
- tapOn: "Keep editing"
- assertNotVisible: "Discard changes"
- assertVisible:
    text: "10.0.2.3"
- back
- extendedWaitUntil:
    visible: "Discard changes"
    timeout: 15000
- tapOn: "Discard changes"
- extendedWaitUntil:
    visible: "Repository FTP ${FTP_HOST}"
    timeout: 15000
