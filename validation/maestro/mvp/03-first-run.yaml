# Story 2 sc. 1-3, FR-006-FR-008, SC-003 (WebDAV): on a fresh install, follow
# only what the screens say until results appear. The Scan tab lists what is
# still needed (server, folders) with Scan disabled; the Files tab explains
# that results appear after a scan and leads to the Scan tab. "Set up the
# server" opens the Repository form, "Add a folder" opens Settings, and once
# both are done Scan is offered and its results show in Files. Story 3 sc.
# 1-2: the folder hint is shown and the picker starts in DCIM. No debug seam
# is used. Self-contained: starts from clearState (contracts/maestro-mvp.md).
appId: com.syncscope
name: mvp/03-first-run
---
- launchApp:
    clearState: true
# The cleared app's own empty Files tab: "Settings" alone can still match the
# previous run's closing window, and a tap then reaches nothing (API 36).
- extendedWaitUntil:
    visible: "No scan results yet"
    timeout: 60000

# Scan tab: what is still needed, and no scan that is certain to fail (FR-007).
- runFlow: ../subflows/open-scan.yaml
- extendedWaitUntil:
    visible: "Before you can scan"
    timeout: 15000
- assertVisible: "Set up the server"
- assertVisible: "Add a folder"
- assertVisible:
    text: "Scan"
    below: "Checks every file in your folders against the backup."
    above: "Settings"
    enabled: false

# Files tab: the empty state leads to the Scan tab (FR-008). The Files tab is
# the one left of Scan; open-files.yaml waits for results, so it is not used.
- tapOn:
    text: "Files"
    leftOf: "Scan"
- extendedWaitUntil:
    visible: "No scan results yet"
    timeout: 15000
- assertVisible: "Results appear after a scan."
- tapOn: "Go to Scan"
- extendedWaitUntil:
    visible: "Before you can scan"
    timeout: 15000

# Set up the server from the checklist: the form opens directly (FR-006).
- tapOn: "Set up the server"
- runFlow:
    file: ../subflows/setup-repository.yaml
    env:
      START: "form"
      PROTOCOL: "WEBDAV"
      HOST: "${WEBDAV_HOST}"
      PORT: "${WEBDAV_PORT}"
      USER: "${WEBDAV_USER}"
      PASSWORD: "${WEBDAV_PASSWORD}"
      ROOT: "${(WEBDAV_ROOT.endsWith('/') ? WEBDAV_ROOT.slice(0, -1) : WEBDAV_ROOT) + '/gallery'}"
      HTTPS: "false"
- assertVisible: "Connected"
- back

# Back on the Scan tab, re-read on focus: only the folder is still missing.
- extendedWaitUntil:
    visible: "Add a folder"
    timeout: 15000
- assertNotVisible: "Set up the server"
- assertVisible:
    text: "Scan"
    below: "Checks every file in your folders against the backup."
    above: "Settings"
    enabled: false

# Add a folder from the checklist: it opens Settings, where the folder is added.
- tapOn: "Add a folder"
- scrollUntilVisible:
    element:
      id: "sources.add"
    direction: DOWN
    timeout: 30000
# Story 3 sc. 1 (FR-009): before adding, a hint names the folders Android
# refuses and suggests ones that work.
- assertVisible: "Folder picker hint"
- tapOn:
    id: "sources.add"
# Story 3 sc. 2: a new folder starts in DCIM. Asserted on the DocumentsUI
# header ("Files in DCIM" on API 31 and API 36), not on the folder list, where
# a "DCIM" entry would also match at the storage root.
- extendedWaitUntil:
    visible: "(?i)files in DCIM"
    timeout: 15000
- runFlow:
    file: ../subflows/pick-folder.yaml
    env:
      VOLUME: "Internal storage"
      PATH: "SyncScopeE2E/Gallery"
- extendedWaitUntil:
    visible:
      id: "sources.row.alias"
      text: "Gallery"
    timeout: 15000

# Everything is ready: the checklist is gone and Scan runs.
- runFlow: ../subflows/open-scan.yaml
- extendedWaitUntil:
    notVisible: "Before you can scan"
    timeout: 15000
- assertVisible:
    text: "Scan"
    below: "Checks every file in your folders against the backup."
    above: "Settings"
    enabled: true
- runFlow: ../subflows/start-scan.yaml
- assertVisible: "Completed .+"
- assertVisible: "Scan summary"
- assertNotVisible: "Scan failed"

# Results are visible in Files.
- runFlow: ../subflows/open-files.yaml
- extendedWaitUntil:
    visible: "beach.png, Synced"
    timeout: 15000
- assertVisible: "sunset.png, Synced"
- assertVisible: "harbor.png, Unsynced"
- assertNotVisible: "No scan results yet"
