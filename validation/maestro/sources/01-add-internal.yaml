# US1-1: add a folder on internal storage. Also covers the edge case
# "picker cancelled": nothing is persisted and the list stays empty.
# First flow of the run: the only one that clears app state.
appId: com.syncscope
name: sources/01-add-internal
---
- launchApp:
    clearState: true
- runFlow: ../subflows/open-sources.yaml
- assertVisible: "No folders added yet."

# Edge case: open the picker and leave it without picking.
- tapOn:
    id: "sources.add"
- extendedWaitUntil:
    notVisible:
      id: "sources.add"
    timeout: 15000
# DocumentsUI may reopen inside the last visited folder, where Back goes up
# a level first; keep pressing Back until the app is showing again.
- repeat:
    while:
      notVisible:
        id: "sources.add"
    times: 8
    commands:
      - back
      - waitForAnimationToEnd
- assertVisible:
    id: "sources.add"
- assertNotVisible:
    id: "sources.row"
- assertNotVisible:
    id: "sources.error"
- assertVisible: "No folders added yet."

# Add SyncScopeE2E/Camera on internal storage.
- tapOn:
    id: "sources.add"
- runFlow:
    file: ../subflows/pick-folder.yaml
    env:
      VOLUME: "Internal storage"
      PATH: "SyncScopeE2E/Camera"
- extendedWaitUntil:
    visible:
      id: "sources.row"
    timeout: 15000
- assertVisible:
    id: "sources.row.alias"
    text: "Camera"
    childOf:
      id: "sources.row"
      index: 0
- assertVisible:
    id: "sources.row.status"
    text: "Available"
    childOf:
      id: "sources.row"
      index: 0
- assertNotVisible:
    id: "sources.row"
    index: 1
- assertNotVisible:
    id: "sources.error"
