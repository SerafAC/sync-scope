# Subflow: launch SyncScope without clearing state and open Settings › Folders.
# Never run on its own; feature flows call it with runFlow.
appId: com.syncscope
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn: "Settings"
# Settings › Repository sits above Folders (feature 006), so once folders are
# listed, Add folder can be below the fold: scroll to it.
- scrollUntilVisible:
    element:
      id: "sources.add"
    direction: DOWN
    timeout: 30000
