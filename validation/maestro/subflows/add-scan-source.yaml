# Subflow: add SyncScopeE2E/Scan on internal storage as a source (and, with
# BULK=true, SyncScopeE2E/Bulk as well). Never run on its own.
#
# Params (runFlow env):
#   BULK  optional: "true" also adds the Bulk source (research R11)
#
# Reuses 003's open-sources and pick-folder subflows. Expects no source to be
# selected yet (every scan flow starts from clearState).
appId: com.syncscope
---
- runFlow: open-sources.yaml
- tapOn:
    id: "sources.add"
- runFlow:
    file: pick-folder.yaml
    env:
      VOLUME: "Internal storage"
      PATH: "SyncScopeE2E/Scan"
- extendedWaitUntil:
    visible:
      id: "sources.row.alias"
      text: "Scan"
    timeout: 15000
- runFlow:
    when:
      true: "${typeof BULK !== 'undefined' && BULK == 'true'}"
    commands:
      - tapOn:
          id: "sources.add"
      - runFlow:
          file: pick-folder.yaml
          env:
            VOLUME: "Internal storage"
            PATH: "SyncScopeE2E/Bulk"
      - extendedWaitUntil:
          visible:
            id: "sources.row.alias"
            text: "Bulk"
          timeout: 15000
- assertNotVisible:
    id: "sources.error"
