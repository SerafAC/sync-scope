# Subflow: add SyncScopeE2E/Scan on internal storage as a source (and, with
# BULK=true, SyncScopeE2E/Bulk as well), or the folders named in SOURCES.
# Never run on its own.
#
# Params (runFlow env):
#   SOURCES  optional: comma-separated folder names under SyncScopeE2E/ on
#            internal storage, added in order, for example
#            "Gallery,GalleryTwin" (005 browse flows); "Scan" by default.
#            Each folder's alias is its name.
#   BULK     optional: "true" also adds the Bulk source (research R11)
#
# Reuses 003's open-sources and pick-folder subflows. Expects no source to be
# selected yet (every scan and browse flow starts from clearState).
appId: com.syncscope
---
- evalScript: "${output.addSources = (typeof SOURCES !== 'undefined' && SOURCES ? SOURCES : 'Scan').split(',').map(function (s) { return s.trim() }).filter(function (s) { return s.length > 0 })}"
- evalScript: "${output.addIndex = 0}"
- runFlow: open-sources.yaml
- repeat:
    while:
      true: "${output.addIndex < output.addSources.length}"
    commands:
      - tapOn:
          id: "sources.add"
      - runFlow:
          file: pick-folder.yaml
          env:
            VOLUME: "Internal storage"
            PATH: "${'SyncScopeE2E/' + output.addSources[output.addIndex]}"
      - extendedWaitUntil:
          visible:
            id: "sources.row.alias"
            text: "${output.addSources[output.addIndex]}"
          timeout: 15000
      - evalScript: "${output.addIndex = output.addIndex + 1}"
- runFlow:
    when:
      true: "${typeof BULK !== 'undefined' && BULK == 'true'}"
    commands:
      - tapOn:
          id: "sources.add"
      - runFlow:
          file: pick-folder.yaml
          env:
            VOLUME: "Internal storage"
            PATH: "SyncScopeE2E/Bulk"
      - extendedWaitUntil:
          visible:
            id: "sources.row.alias"
            text: "Bulk"
          timeout: 15000
- assertNotVisible:
    id: "sources.error"
