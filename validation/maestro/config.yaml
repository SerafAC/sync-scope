# Maestro workspace for `pnpm e2e:android` (conventions:
# specs/003-local-source-selection/contracts/maestro-conventions.md).
#
# Only feature directories are run as flows; subflows/ holds reusable steps
# that are never run on their own. Each flow declares `name: <dir>/<file>`
# (for example `name: sources/01-add-internal`) so it matches flowsOrder.
# Later flows depend on state from earlier ones, so the order is pinned and
# the run stops at the first failure.
flows:
  - "sources/*"
  - "scan/*"
  - "browse/*"
  - "mvp/*"
  - "polish/*"

executionOrder:
  continueOnFailure: false
  flowsOrder:
    - sources/01-add-internal
    - sources/02-add-removable
    - sources/03-reject-overlap
    - sources/04-restart-persists
    - sources/05-revoked-unavailable
    - sources/06-regrant
    - sources/07-remove
    - scan/01-clean-scan-ftp
    - scan/01-clean-scan-sftp
    - scan/01-clean-scan-webdav
    - scan/02-partial-listing-ftp
    - scan/02-partial-listing-sftp
    - scan/02-partial-listing-webdav
    - scan/03-rescan
    - scan/04-reopen-refresh
    - scan/05-background-discards
    - scan/06-unreachable-fails
    - scan/07-revoked-source
    - browse/01-gallery-thousands
    - browse/02-gallery-filters
    - browse/03-gallery-issues-unknown
    - browse/04-list-browse
    - browse/05-results-updated
    - mvp/01-setup-ftp
    - mvp/01-setup-sftp
    - mvp/01-setup-webdav
    - mvp/02-setup-errors
    - mvp/03-first-run
    - mvp/04-select-size
    - mvp/05-delete-synced
    - mvp/90-release-smoke
    - mvp/91-release-update
    - polish/01-sort
    - polish/02-sort-persists
    - polish/04-remote-folders-webdav
    - polish/05-remote-folder-unread-ftp
    - polish/06-remote-browse-sftp
