# Acceptance 4, FR-004 (SFTP): "Rescan from scratch" runs a new full scan and
# publishes a new snapshot: the generation goes up and the completion time
# changes. Self-contained: starts from clearState.
appId: com.syncscope
name: scan/03-rescan
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/configure-repository.yaml
    env:
      PROTOCOL: "SFTP"
      PORT: "${SFTP_PORT}"
      USER: "${SFTP_USER}"
      PASSWORD: "${SFTP_PASSWORD}"
      ROOT: "${(SFTP_ROOT.endsWith('/') ? SFTP_ROOT.slice(0, -1) : SFTP_ROOT) + '/scan/clean'}"
- runFlow: ../subflows/add-scan-source.yaml
- runFlow: ../subflows/open-scan.yaml
- runFlow: ../subflows/start-scan.yaml
- assertVisible: "Full scan"
- assertVisible: "Synced: 4"

# Record the first generation and completion time.
- copyTextFrom: "Generation \\d+"
- evalScript: "${output.firstGeneration = parseInt(maestro.copiedText.replace('Generation ', ''), 10)}"
- copyTextFrom: "Completed .+"
- evalScript: "${output.firstCompleted = maestro.copiedText}"

# The completion time is shown to the second; make sure the next one differs.
- extendedWaitUntil:
    visible: "syncscope-rescan-settle"
    timeout: 1500
    optional: true
- runFlow:
    file: ../subflows/start-scan.yaml
    env:
      BUTTON: "Rescan from scratch"
- assertVisible: "Full scan"
- assertVisible: "Synced: 4"
- copyTextFrom: "Generation \\d+"
- evalScript: "${output.secondGeneration = parseInt(maestro.copiedText.replace('Generation ', ''), 10)}"
- assertTrue: "${output.secondGeneration > output.firstGeneration}"
- copyTextFrom: "Completed .+"
- assertTrue: "${maestro.copiedText != output.firstCompleted}"
