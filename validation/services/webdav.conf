DavLockDB "/usr/local/apache2/var/DavLock"

LogFormat "%m %U %s" syncscope_audit
CustomLog /proc/self/fd/1 syncscope_audit

Alias "/webdav" "/usr/local/apache2/htdocs/webdav"
<Directory "/usr/local/apache2/htdocs/webdav">
    Dav On
    Options Indexes
    AuthType Basic
    AuthName "SyncScope validation fixture"
    AuthUserFile "/usr/local/apache2/conf/validation.htpasswd"
    Require valid-user
    <LimitExcept GET HEAD OPTIONS PROPFIND>
        Require all denied
    </LimitExcept>
</Directory>
